<title>Koottu</title>
<style>
/*KOOTTU_CSS*/
:root{color-scheme:light}
[hidden]{display:none!important}
html,body{background:#F3F5F1;color:#16302B}
#app{min-height:100vh;display:flex;flex-direction:column}
#app>main{flex:1}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mk-dot{width:10px;height:10px;border-radius:50%;background:#F5C400;border:1.5px solid #111}
.mk-ring{width:46px;height:46px;border-radius:50%;border:2px solid #16302B}
.mk-cab{width:28px;height:28px;background:#F5C400;border:2px solid #111;color:#111;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.board-map svg.ic{width:16px;height:16px;display:inline-block}
.lbl-down{position:absolute;transform:translate(-50%,-50%);background:#FDE0DC;color:#8E1B15;border:1.5px solid #8E1B15;padding:2px 10px;font-weight:700;font-size:14px;border-radius:4px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.sys-sec{padding:32px 24px;border-top:1px solid #B8C2B6;display:flex;flex-direction:column;gap:20px;max-width:1280px}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sw-cell{border:1px solid #B8C2B6;background:#fff;display:flex;flex-direction:column}
.sw-cell .chipcol{height:56px;border-bottom:1px solid #B8C2B6}
.sw-cell .meta{padding:8px 10px;font-size:14px;line-height:20px}
.demo-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spec{font-size:14px;line-height:20px;color:#3A4A47}
.lead-stage{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:24px 16px}
.lead-note{max-width:320px;display:flex;flex-direction:column;gap:12px}
.cards tr.cr td .sortbtn{font-size:16px;text-align:left}
@media (max-width:1023px){.topbar{padding:0 16px}}
@media (max-width:479px){.hide-xs{display:none}.topbar{gap:8px}.topbar .wordmark{font-size:18px;gap:6px}.bar-right{gap:8px}.topbar .tag-sample{padding:2px 8px}.lead-phone{width:100%!important;border:0}.lead-stage{padding:0}.sys-sec{padding:24px 16px}.arena-head,.md-list,.md-detail,.board-ctl{padding-left:16px;padding-right:16px}}
</style>

<script>
(function () {
'use strict';
var app = document.getElementById('app');
function ic(n, c) { return '<svg class="ic' + (c ? ' ' + c : '') + '" aria-hidden="true"><use href="#i-' + n + '"></use></svg>'; }
function chip(k, i, w, st) { return '<span class="chip chip-' + k + '"' + (st ? ' style="' + st + '"' : '') + '>' + ic(i) + w + '</span>'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function cl(v) { return Math.max(0, Math.min(1, v)); }
var ob = []; try { ob = JSON.parse(localStorage.getItem('koottu.outbox') || '[]'); } catch (e) { ob = []; }
function saveOb() { try { localStorage.setItem('koottu.outbox', JSON.stringify(S.outbox)); } catch (e) {} }

var S = { route: 'arena', kb: false, offline: false, lang: 'en', sampleOpen: false, outbox: ob,
  r: { st: 'check', bridge: false, locked: false, lockQueued: false, checked: false, shot: false, amount: '649', base: '', spot: 'Guindy station east exit', dest: 'Tambaram', app: 'Ride app A', paused: false, bids: false },
  a: { sel: 'C01', status: { C01: 'pass', C05: 'pass', C09: 'pass' }, filter: 'all', query: '', sort: '', dir: 1, runAll: null, allDone: false, paste: '', pasteErr: false, pasteNote: '', audit: false },
  b: { t: -1, playing: false, paused: false, speed: 1, tableOpen: false, reduced: false },
  l: { view: 'scan', code: '', err: false, queued: 3, seats: 2 },
  y: { xa: false, tip: null, drawer: false, dialog: false } };
var focusId = null, rT = [];
function rLater(ms, f) { rT.push(setTimeout(f, ms)); }
function rClear() { rT.forEach(clearTimeout); rT = []; }

/* ---------- routing: #arena #rider #board #lead #system (also #/rider?mode=keyboard when self-hosted) ---------- */
var ROUTES = ['arena', 'board', 'rider', 'lead', 'system'];
function parseHash(raw) {
  var h = (raw != null ? raw : (location.hash || '')).replace(/^#\/?/, '');
  S.kb = /mode=keyboard/.test(h) || h === 'rider-keyboard';
  var r = h.split(/[?\-]/)[0];
  S.route = ROUTES.indexOf(r) >= 0 ? r : 'arena';
}

/* ---------- shell ---------- */
var TABS = [['arena', 'shield', 'Judges'], ['board', 'map', 'Live board'], ['rider', 'phone', 'Rider'], ['lead', 'ticket', 'Lead’s phone']];
function tabs(cls) { return TABS.map(function (t) { var on = S.route === t[0]; return '<a class="tab' + (on ? ' active' : '') + '" href="#' + t[0] + '"' + (on ? ' aria-current="page"' : '') + '>' + ic(t[1]) + (cls && t[0] === 'lead' ? 'Lead' : t[2]) + '</a>'; }).join(''); }
var LANGS = [['en', 'English', 'EN'], ['ta', 'தமிழ்', 'தமிழ்'], ['hi', 'हिन्दी', 'हिं']];
function langSeg(short, extra) { return '<div class="seg' + (extra || '') + '" role="group" aria-label="Language">' + LANGS.map(function (l) { return '<button lang="' + l[0] + '" aria-pressed="' + (S.lang === l[0]) + '" data-a="lang" data-v="' + l[0] + '">' + (short ? l[2] : l[1]) + '</button>'; }).join('') + '</div>'; }
function shell(inner) {
  return '<a class="skip" href="#next" data-a="skip">Skip to the next step</a>' +
  '<header class="topbar"><a class="wordmark" href="#arena"><span class="ta" lang="ta">கூட்டு</span><span>Koottu</span></a>' +
  '<nav class="tabs" aria-label="Main">' + tabs() + '</nav><div class="bar-right">' +
  '<button class="switch" role="switch" aria-checked="' + !S.offline + '" data-a="net"><span class="sw-track"><span class="sw-knob"></span></span><span class="hide-sm">Network: </span>' + (S.offline ? 'Cut' : 'On') + '</button>' +
  langSeg(false, ' hide-sm') +
  '<button class="tag tag-sample" aria-expanded="' + S.sampleOpen + '" data-a="sample">Sample<span class="hide-xs"> data</span></button></div>' +
  (S.sampleOpen ? '<div class="pop" role="dialog" aria-label="About the sample data"><p>All riders, fares and cabs in this demo are synthetic. Place names are real.</p></div>' : '') + '</header>' +
  (S.offline ? '<div class="banner banner-dark on-dark" role="status">' + ic('wifioff') + '<p><span class="acc b">Network cut.</span> Koottu is still working offline.</p></div>' : '') +
  (S.kb && S.route === 'rider' ? '<div class="banner banner-info" role="status">' + ic('keyboard') + '<p>Keyboard-only test mode: pointer is off and colour is removed.</p></div>' : '') +
  '<main>' + inner + '</main>' +
  '<footer class="footer"><a href="#system">Design system</a><span>All riders, fares and cabs are synthetic. Place names are real.</span></footer>' +
  '<nav class="bottombar" aria-label="Main">' + tabs(true) + '</nav>';
}

/* ---------- RIDER ---------- */
var M = {
  check: { word: 'Check', band: 'band-check', icon: 'search', step: 1, dark: false, color: '#F5C400', notice: 'Type a fare and press Check this fare. With no verified base fare it says it cannot be checked against the legal cap, instead of guessing.' },
  finding: { word: 'Finding your group', band: 'band-finding', icon: 'people', step: 2, dark: true, color: '#0F4C81', notice: 'The band turns blue and says exactly what it is looking for. The dots stop under reduced motion and have a Pause control.' },
  question: { word: 'Needs your answer', band: 'band-question', icon: 'question', step: 2, dark: true, color: '#5B2A9E', notice: 'C12: the sharing preference is not confirmed, so Koottu asks instead of guessing. One large button per answer.' },
  waiting: { word: 'Waiting', band: 'band-waiting', icon: 'clock', step: 2, dark: false, color: '#F58A1F', notice: 'C05: a refused rider gets a reason they can check. Open Why not? Orange and yellow are also told apart by the clock icon and the word.' },
  forming: { word: 'Forming', band: 'band-forming', icon: 'group', step: 2, dark: true, color: '#0E6E8C', notice: 'Seats show a shape and a word. Four phones, four quotes, cheapest books. The share is an estimate until the group fills.' },
  ready: { word: 'Ready', band: 'band-ready', icon: 'ticket', step: 3, dark: true, color: '#0B7A4F', notice: 'Money is the headline, not the QR. Cut the network: the pass still works and Lock my share is queued with a reason.' },
  booked: { word: 'Booked', band: 'band-booked', icon: 'checkc', step: 4, dark: true, color: '#064E32', notice: 'Koottu never touches money. The rider pays the person who booked, by UPI.' }
};
var QR = (function () { var n = 21, out = ''; for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) { var v = null, fs = [[0, 0], [14, 0], [0, 14]];
  for (var i = 0; i < 3; i++) { var dx = x - fs[i][0], dy = y - fs[i][1]; if (dx >= 0 && dy >= 0 && dx < 7 && dy < 7) v = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)) !== 2; }
  if (v === null) v = ((x === 7 && y < 8) || (y === 7 && x < 8) || (x === 13 && y < 8) || (y === 7 && x > 12) || (y === 13 && x < 8) || (x === 7 && y > 12)) ? false : ((x * 7 + y * 13 + x * y * 3) % 5) < 2;
  out += '<i' + (v ? ' class="on"' : '') + '></i>'; } return out; })();
function go(st, focus) { rClear(); S.r.st = st; S.r.bids = false; if (focus) focusId = 'next'; }
function sel(id, val, opts, lab) { return '<div class="field"><label for="' + id + '">' + lab + '</label><select id="' + id + '" class="input" data-in="r.' + id + '">' + opts.map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
function seats(sz) { var s = sz ? ' style="width:' + sz + 'px;height:' + sz + 'px"' : '', c = sz ? 'ic-16' : 'ic-24';
  return '<span class="seat you"' + s + '>' + ic('check', c) + '</span><span class="seat filled"' + s + '>' + ic('check', c) + '</span><span class="seat"' + s + '></span><span class="seat"' + s + '></span>'; }
function offBtn(id, label, icon, why, act) { return '<div class="stack g2"><button id="' + id + '" class="btn btn-lg" disabled aria-describedby="' + id + '-why">' + ic(icon, 'ic-24') + label + '</button><p id="' + id + '-why" class="reason">' + ic('wifioff', 'ic-16') + '<span>' + why + '</span></p><button class="btn btn-secondary" data-a="' + act + '">Queue it</button></div>'; }
function rider() {
  var r = S.r, m = M[r.st], off = S.offline, h = '';
  var amt = parseFloat(r.amount) || 0, base = parseFloat(r.base) || 0, cap = base * 2, capLine, capIcon, verdict;
  if (!base) { capLine = 'This fare cannot be checked against the legal cap yet. Enter a verified base fare.'; capIcon = 'info'; verdict = 'Rs ' + amt + ' looks high for this trip right now.'; }
  else if (amt <= cap) { capLine = 'This fare is within the legal cap of Rs ' + cap + ' (2x your verified base fare of Rs ' + base + ').'; capIcon = 'checkc'; verdict = 'Rs ' + amt + ' is within the legal cap.'; }
  else { capLine = 'This fare is above the legal cap of Rs ' + cap + ' (2x your verified base fare of Rs ' + base + ').'; capIcon = 'cross'; verdict = 'Rs ' + amt + ' is above the legal cap.'; }
  if (S.lang !== 'en') h += '<p class="row g2 t-small" style="background:#fff;border:1.5px solid #3A4A47;padding:8px 12px;align-items:flex-start">' + ic('lang', 'ic-16') + '<span>Shown in English: a verified translation is not available.</span></p>';
  if (r.bridge) h += '<div class="card-white" style="border-color:#8E1B15"><h2 class="t-h3">Rail is down. This short ride takes you to Pallavaram.</h2>' +
    '<svg class="minimap" viewBox="0 0 350 120" role="img" aria-label="Map: a short cab ride from Guindy, where the rail is down, to Pallavaram station, which is working"><rect width="350" height="120" fill="#D9DFD6"></rect><path d="M40 30 L80 60" stroke="#16302B" stroke-width="4" stroke-dasharray="6 5" fill="none"></path><path d="M80 60 L290 80" stroke="#16302B" stroke-width="3" fill="none"></path><circle cx="80" cy="60" r="11" fill="#C4271E"></circle><path d="M75 55l10 10M85 55l-10 10" stroke="#fff" stroke-width="2.5"></path><circle cx="290" cy="80" r="11" fill="#0B7A4F"></circle><path d="M284 80l4 4 7-8" stroke="#fff" stroke-width="2.5" fill="none"></path><rect x="170" y="56" width="24" height="24" fill="#F5C400" stroke="#111" stroke-width="2"></rect><text x="182" y="73" text-anchor="middle" font-size="14" font-weight="800" fill="#111">4</text><text x="64" y="96" font-size="13" font-weight="700" fill="#16302B">Guindy</text><text x="250" y="108" font-size="13" font-weight="700" fill="#16302B">Pallavaram</text></svg>' +
    '<p><b>New meeting point:</b> Guindy station east exit, gate 2, 17:50.</p>' + chip('group', 'bridge', 'Bridge ride', 'align-self:flex-start') + '</div>';
  if (r.st === 'check') {
    h += '<div class="stack g3"><h1 id="next" tabindex="-1" class="t-sign xs">Is this fare fair?</h1><p>Ride apps overcharge you when everyone needs a cab. Koottu checks your fare and shares the cab.</p></div>' +
      '<form id="fare-form" class="card-white" aria-label="Fare check">' +
      sel('spot', r.spot, ['Guindy station east exit', 'SRM main gate', 'Tambaram station', 'Chromepet'], 'Where are you?') +
      sel('dest', r.dest, ['Tambaram', 'Velachery', 'T Nagar', 'Airport'], 'Where to?') +
      sel('app', r.app, ['Ride app A', 'Ride app B', 'Auto or bike app'], 'Which app shows this fare?') +
      '<div class="field"><label for="amount">Fare your app shows</label><div class="money"><span class="pre" aria-hidden="true">Rs</span><input id="amount" class="input" inputmode="decimal" value="' + esc(r.amount) + '" data-in="r.amount" aria-describedby="amount-help"></div><p id="amount-help" class="help">Type it, or read it from a screenshot below.</p></div>' +
      '<div class="field"><label for="base">Verified base fare (optional)</label><div class="money"><span class="pre" aria-hidden="true">Rs</span><input id="base" class="input" inputmode="decimal" value="' + esc(r.base) + '" data-in="r.base" aria-describedby="base-help"></div><p id="base-help" class="help">The legal cap is 2x the base fare. We cannot check it until you enter a verified base fare.</p></div>' +
      '<div class="field"><label for="shot">Screenshot of your fare (optional)</label><input id="shot" type="file" accept="image/*" class="input" style="padding:10px"><p id="shot-out" class="help" aria-live="polite">' + (r.shot ? 'Read Rs 649 from the screenshot. Sample: the reading is simulated.' : 'Koottu reads the fare from the image on your phone. The image is not uploaded.') + '</p></div>' +
      '<button type="submit" class="btn btn-primary btn-lg">' + ic('search', 'ic-24') + 'Check this fare</button></form>' +
      '<div id="check-out" class="stack g3" aria-live="polite">' + (r.checked ? '<div class="card-white"><h2 id="result" tabindex="-1" class="t-h3">' + verdict + '</h2>' +
        (off ? chip('wait', 'clock', 'Using fares saved at 17:12', 'align-self:flex-start') : '') +
        '<p class="row g2" style="align-items:flex-start">' + ic(capIcon) + '<span>' + capLine + '</span></p>' +
        '<p class="row g2" style="align-items:flex-start">' + ic('clock') + '<span>Surge likely to ease to about 1.26x in 15 minutes. Waiting may save money.</span></p>' +
        '<h3 class="t-body b">What else you could do</h3><ul style="list-style:none;margin:0;padding:0">' +
        '<li class="adv">' + ic('people', 'ic-24') + '<span><b>Share.</b> Split one cab with people going your way. With 2 people, about Rs ' + Math.round(amt / 2) + ' each.</span></li>' +
        '<li class="adv">' + ic('clock', 'ic-24') + '<span><b>Wait.</b> The fare may drop in about 15 minutes.</span></li>' +
        '<li class="adv">' + ic('walk', 'ic-24') + '<span><b>Walk to another gate.</b> The west exit is 4 minutes away and quieter.</span></li>' +
        '<li class="adv">' + ic('phone', 'ic-24') + '<span><b>Try another app.</b> Check the same trip on another ride app.</span></li></ul>' +
        '<p class="t-small muted">Sample: fare history and surge are simulated.</p></div>' : '') + '</div>' +
      (off ? offBtn('ride', 'Find my group', 'people', 'Needs a network. Queued until you reconnect.', 'queueGroup') : '<button id="ride" class="btn btn-yellow btn-lg" data-a="find">' + ic('people', 'ic-24') + 'Find my group</button>');
  }
  if (r.st === 'finding') h += '<h1 id="next" tabindex="-1" class="t-sign xs">Finding your group</h1><div class="dots' + (r.paused ? ' paused' : '') + '" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
    '<p class="t-h3" style="font-weight:500">Looking for people at ' + esc(r.spot) + ' going towards ' + esc(r.dest) + ', inside your circle.</p><p class="t-small">This usually takes under a minute. Your place is kept if the signal drops.</p>' +
    '<button class="btn btn-quiet btn-sm" style="align-self:flex-start" data-a="dotsPause">' + ic(r.paused ? 'play' : 'pause') + (r.paused ? 'Play animation' : 'Pause animation') + '</button>';
  if (r.st === 'question') h += '<h1 id="next" tabindex="-1" class="t-display xs">Are you happy to share with people outside your circle?</h1><p><b>Why we ask.</b> Your sharing preference is not confirmed. We would rather ask than guess.</p>' +
